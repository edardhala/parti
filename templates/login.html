<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Parti Professor Sign-in</title>
<style>
  :root {
    --accent: #4338ca; --on-accent: #ffffff;
    --ink: #101828; --muted: #475467; --line: #e4e7ec; --line-strong: #98a2b3;
    --bg: #f8f9fb; --surface: #ffffff; --danger: #b42318;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #a5b4fc; --on-accent: #0f1320;
      --ink: #f2f4f7; --muted: #a9b1c1; --line: #2a3042; --line-strong: #5a6378;
      --bg: #0f1320; --surface: #171c2c; --danger: #fda29b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.55; color: var(--ink); background: var(--bg); }
  main { max-width: 420px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .muted { color: var(--muted); font-size: .875rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-top: 24px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px;
    font: inherit; color: var(--ink); background: var(--surface);
  }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .error { color: var(--danger); font-size: .875rem; font-weight: 600; margin: 8px 0 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; margin-top: 16px;
    border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Professor sign-in</h1>
  <p class="muted">Sign in to save grades, notes and summary reviews.</p>
  <form class="card" method="post" action="{{ url_for('parti.login') }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
      {% if error %}aria-invalid="true" aria-describedby="password-err"{% endif %}>
    {% if error %}<p class="error" id="password-err" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="btn">Sign in</button>
  </form>
  <p class="muted"><a href="{{ url_for('parti.index') }}">Back to Parti</a></p>
</main>
</body>
</html>
