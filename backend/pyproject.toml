[project]
name = "parti"
version = "0.2.0"
description = "Participation evidence for professors. The professor always has the final say."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "authlib==1.4.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parti*"]

[tool.setuptools.package-data]
parti = ["templates/*.html", "static/*.html"]

[tool.vercel]
entrypoint = "parti.asgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parti --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["parti/seed.py", "parti/cli.py", "parti/legacy_flask_app.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"dev/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
packages = ["parti"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
